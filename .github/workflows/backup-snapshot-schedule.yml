name: Database Snapshot Backup (PROD schedule)

# PROD every 4 hours. Separate file avoids GitHub push-event bugs on the manual workflow.
on:
  schedule:
    - cron: "0 */4 * * *"

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BACKUP_ENV: prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Export environment-specific secrets
        run: |
          echo "DB_URL=${{ secrets.SUPABASE_PROD_DB_URL }}"           >> "$GITHUB_ENV"
          echo "DB_PASSWORD=${{ secrets.SUPABASE_PROD_DB_PASSWORD }}" >> "$GITHUB_ENV"
          echo "DB_POOLER_HOST=${{ secrets.SUPABASE_PROD_DB_POOLER_HOST }}" >> "$GITHUB_ENV"
          echo "SUPABASE_URL=${{ secrets.SUPABASE_PROD_URL }}"        >> "$GITHUB_ENV"
          echo "SERVICE_KEY=${{ secrets.SUPABASE_PROD_SERVICE_ROLE_KEY }}" >> "$GITHUB_ENV"

      - name: Sync backup_logs metadata (pre-dump)
        run: python3 .github/scripts/sync-backup-logs-metadata.py
        env:
          SYNC_ENV: prod
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SERVICE_KEY: ${{ env.SERVICE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Configure PostgreSQL connection (IPv4)
        run: bash .github/scripts/configure-pg-ipv4.sh

      - name: Install matching PostgreSQL client
        run: bash .github/scripts/install-pg-client.sh

      - name: Test database connection
        run: |
          set -euo pipefail
          source /tmp/pg-connection.env
          psql -v ON_ERROR_STOP=1 -c "select current_database(), count(*) from information_schema.tables where table_schema = 'public';"

      - name: Dump database
        run: |
          set -euo pipefail
          source /tmp/pg-connection.env
          PG_DUMP="${PG_BIN_DIR:-}/pg_dump"
          if [ ! -x "$PG_DUMP" ]; then
            PG_DUMP=$(command -v pg_dump)
          fi
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
          FILENAME="prod-snapshot-${TIMESTAMP}.sql.gz"
          echo "FILENAME=${FILENAME}" >> "$GITHUB_ENV"
          echo "FILE_PATH=prod/${FILENAME}" >> "$GITHUB_ENV"

          if ! "$PG_DUMP" \
            --schema=public \
            --no-owner \
            --no-acl \
            --format=plain \
            2>pg_dump.log \
          | gzip > "${FILENAME}"; then
            cat pg_dump.log || true
            exit 1
          fi

          FILE_SIZE=$(stat --format='%s' "${FILENAME}")
          TABLE_COUNT=$(gzip -dc "${FILENAME}" | grep -c '^CREATE TABLE ' || true)
          if [ "$FILE_SIZE" -lt 500 ] || [ "$TABLE_COUNT" -eq 0 ]; then
            exit 1
          fi
          echo "TABLE_COUNT=${TABLE_COUNT}" >> "$GITHUB_ENV"
          echo "FILE_SIZE=${FILE_SIZE}" >> "$GITHUB_ENV"

      - name: Insert backup_log (running)
        id: log
        env:
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SERVICE_KEY: ${{ env.SERVICE_KEY }}
          BACKUP_STARTED_AT: ${{ github.run_started_at }}
        run: |
          set -euo pipefail
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          STARTED_AT="${BACKUP_STARTED_AT:-}"
          if [ -z "${STARTED_AT}" ]; then
            STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          LOG_ID=$(bash .github/scripts/insert-backup-log.sh "{
            \"backup_type\": \"snapshot\",
            \"operation\": \"backup\",
            \"environment\": \"prod\",
            \"status\": \"running\",
            \"triggered_by\": \"schedule\",
            \"started_at\": \"${STARTED_AT}\",
            \"file_path\": \"${FILE_PATH}\",
            \"file_size_bytes\": ${FILE_SIZE},
            \"tables_dumped\": ${TABLE_COUNT},
            \"github_run_url\": \"${RUN_URL}\"
          }")
          echo "id=${LOG_ID}" >> "$GITHUB_OUTPUT"

      - name: Collect row counts
        id: counts
        run: |
          set -euo pipefail
          source /tmp/pg-connection.env
          ROW_COUNTS=$(psql -t -A -c "
            select coalesce(json_object_agg(table_name, cnt), '{}'::json)
            from (
              select 'profiles' as table_name, count(*)::bigint as cnt from public.profiles
              union all select 'posts', count(*)::bigint from public.posts
              union all select 'jobs', count(*)::bigint from public.jobs
              union all select 'direct_messages', count(*)::bigint from public.direct_messages
            ) t;
          " | tr -d '[:space:]')
          echo "json=${ROW_COUNTS}" >> "$GITHUB_OUTPUT"

      - name: Upload to Supabase Storage
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            "${SUPABASE_URL}/storage/v1/object/backups/${FILE_PATH}" \
            -H "Authorization: Bearer ${SERVICE_KEY}" \
            -H "Content-Type: application/gzip" \
            --data-binary "@${FILENAME}")
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            exit 1
          fi

      - name: Update backup_log (completed)
        if: success()
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          payload = {
              "status": "completed",
              "completed_at": subprocess.check_output(["date", "-u", "+%Y-%m-%dT%H:%M:%SZ"], text=True).strip(),
              "file_path": os.environ["FILE_PATH"],
              "file_size_bytes": int(os.environ["FILE_SIZE"]),
              "tables_dumped": int(os.environ["TABLE_COUNT"]),
              "row_counts": json.loads(os.environ.get("ROW_COUNTS_JSON", "{}") or "{}"),
          }
          started_at = os.environ.get("BACKUP_STARTED_AT", "").strip()
          if started_at:
              payload["started_at"] = started_at
          url = os.environ["SUPABASE_URL"] + "/rest/v1/backup_logs?id=eq." + os.environ["LOG_ID"]
          req = urllib.request.Request(url, data=json.dumps(payload).encode(), method="PATCH", headers={
              "Authorization": f"Bearer {os.environ['SERVICE_KEY']}",
              "apikey": os.environ["SERVICE_KEY"],
              "Content-Type": "application/json",
          })
          with urllib.request.urlopen(req) as resp:
              print(resp.status)
          PY
        env:
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SERVICE_KEY: ${{ env.SERVICE_KEY }}
          FILE_PATH: ${{ env.FILE_PATH }}
          FILE_SIZE: ${{ env.FILE_SIZE }}
          TABLE_COUNT: ${{ env.TABLE_COUNT }}
          LOG_ID: ${{ steps.log.outputs.id }}
          ROW_COUNTS_JSON: ${{ steps.counts.outputs.json }}
          BACKUP_STARTED_AT: ${{ github.run_started_at }}

      - name: Sync backup_logs metadata (post-backup)
        if: success()
        run: python3 .github/scripts/sync-backup-logs-metadata.py
        env:
          SYNC_ENV: prod
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SERVICE_KEY: ${{ env.SERVICE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LOCAL_BACKUP_FILE: ${{ env.FILENAME }}

      - name: Delete PROD snapshots older than 168 hours (7 days)
        if: success()
        run: bash .github/scripts/cleanup-old-backups.sh prod 168 snapshot
        env:
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SERVICE_KEY: ${{ env.SERVICE_KEY }}

      - name: Update backup_log (failed)
        if: failure()
        run: |
          curl -s -X PATCH \
            "${SUPABASE_URL}/rest/v1/backup_logs?id=eq.${{ steps.log.outputs.id }}" \
            -H "Authorization: Bearer ${SERVICE_KEY}" \
            -H "apikey: ${SERVICE_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"failed\",\"completed_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"error_message\":\"Scheduled PROD backup failed.\"}" || true
