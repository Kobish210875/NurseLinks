name: Restore Database from Backup

# MANUAL ONLY — never runs on a schedule.
# Triggered from the admin UI (Restore button) or directly from GitHub.
#
# ⚠️  WARNING: This drops and recreates the public schema.
#              All existing data in public.* will be overwritten.
#              Run this only after confirming with the team.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to restore INTO"
        required: true
        type: choice
        options:
          - dev
          - prod
      backup_file_path:
        description: "File path inside the 'backups' bucket (e.g. prod/prod-full-20260621T020000Z.sql.gz)"
        required: true
        type: string
      backup_log_id:
        description: "backup_logs.id to mark as the restore point (optional)"
        required: false
        type: string
      confirm:
        description: "Type RESTORE to confirm you want to overwrite the target database"
        required: true
        type: string

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── safety guard ─────────────────────────────────────────────────────────
      - name: Confirm restore intent
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "RESTORE" ]; then
            echo "❌ Safety check failed. You must type RESTORE in the confirm field."
            exit 1
          fi

      # ── pick the right secrets ───────────────────────────────────────────────
      - name: Export environment-specific secrets
        run: |
          if [ "${{ github.event.inputs.environment }}" = "prod" ]; then
            echo "DB_URL=${{ secrets.SUPABASE_PROD_DB_URL }}"                >> "$GITHUB_ENV"
            echo "DB_PASSWORD=${{ secrets.SUPABASE_PROD_DB_PASSWORD }}"        >> "$GITHUB_ENV"
            echo "DB_POOLER_HOST=${{ secrets.SUPABASE_PROD_DB_POOLER_HOST }}"  >> "$GITHUB_ENV"
            echo "SUPABASE_URL=${{ secrets.SUPABASE_PROD_URL }}"             >> "$GITHUB_ENV"
            echo "SERVICE_KEY=${{ secrets.SUPABASE_PROD_SERVICE_ROLE_KEY }}" >> "$GITHUB_ENV"
          else
            echo "DB_URL=${{ secrets.SUPABASE_DEV_DB_URL }}"                 >> "$GITHUB_ENV"
            echo "DB_PASSWORD=${{ secrets.SUPABASE_DEV_DB_PASSWORD }}"       >> "$GITHUB_ENV"
            echo "DB_POOLER_HOST=${{ secrets.SUPABASE_DEV_DB_POOLER_HOST }}" >> "$GITHUB_ENV"
            echo "SUPABASE_URL=${{ secrets.SUPABASE_DEV_URL }}"              >> "$GITHUB_ENV"
            echo "SERVICE_KEY=${{ secrets.SUPABASE_DEV_SERVICE_ROLE_KEY }}"  >> "$GITHUB_ENV"
          fi

      - name: Configure PostgreSQL connection (IPv4)
        run: bash .github/scripts/configure-pg-ipv4.sh

      - name: Install matching PostgreSQL client
        run: bash .github/scripts/install-pg-client.sh

      # ── download the backup file from Supabase Storage ───────────────────────
      - name: Download backup file
        run: |
          FILE_PATH="${{ github.event.inputs.backup_file_path }}"
          FILENAME=$(basename "${FILE_PATH}")
          echo "FILENAME=${FILENAME}" >> "$GITHUB_ENV"

          HTTP_STATUS=$(curl -s -o "${FILENAME}" -w "%{http_code}" \
            "${SUPABASE_URL}/storage/v1/object/backups/${FILE_PATH}" \
            -H "Authorization: Bearer ${SERVICE_KEY}")

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Failed to download backup (HTTP ${HTTP_STATUS})"
            exit 1
          fi
          echo "Downloaded ${FILENAME} ($(stat --format='%s' ${FILENAME}) bytes)"

      # ── restore ──────────────────────────────────────────────────────────────
      - name: Drop and recreate public schema
        run: |
          set -euo pipefail
          source /tmp/pg-connection.env
          psql -v ON_ERROR_STOP=1 -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"

      - name: Restore from backup
        id: restore
        run: |
          set -euo pipefail
          source /tmp/pg-connection.env
          gunzip -c "${FILENAME}" | psql -v ON_ERROR_STOP=1

      # Audit log only — must not fail the restore job
      - name: Log restore to backup_logs
        if: steps.restore.outcome == 'success'
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import urllib.error
          import urllib.request

          supabase_url = os.environ["SUPABASE_URL"].rstrip("/")
          service_key = os.environ["SERVICE_KEY"]
          environment = os.environ["RESTORE_ENV"]
          file_path = os.environ["RESTORE_FILE_PATH"]
          run_url = os.environ["GITHUB_RUN_URL"]
          log_id = os.environ.get("RESTORE_LOG_ID", "").strip()

          payload = {
              "backup_type": "snapshot",
              "environment": environment,
              "status": "completed",
              "triggered_by": "manual",
              "completed_at": subprocess.check_output(
                  ["date", "-u", "+%Y-%m-%dT%H:%M:%SZ"], text=True
              ).strip(),
              "file_path": file_path,
              "github_run_url": run_url,
              "error_message": f"RESTORE from: {file_path}",
          }

          headers = {
              "Authorization": f"Bearer {service_key}",
              "apikey": service_key,
              "Content-Type": "application/json",
          }

          def request(method, url, body=None):
              data = json.dumps(body).encode("utf-8") if body is not None else None
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  return resp.status

          try:
              if log_id:
                  url = f"{supabase_url}/rest/v1/backup_logs?id=eq.{log_id}"
                  status = request("PATCH", url, {k: v for k, v in payload.items() if k != "backup_type"})
                  print(f"Updated backup_log {log_id} (HTTP {status})")
              else:
                  url = f"{supabase_url}/rest/v1/backup_logs"
                  status = request("POST", url, payload)
                  print(f"Inserted restore audit row (HTTP {status})")
          except urllib.error.HTTPError as err:
              body = err.read().decode("utf-8", errors="replace")
              print(f"Audit log skipped (HTTP {err.code}): {body}")
          PY
        env:
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SERVICE_KEY: ${{ env.SERVICE_KEY }}
          RESTORE_ENV: ${{ github.event.inputs.environment }}
          RESTORE_FILE_PATH: ${{ github.event.inputs.backup_file_path }}
          RESTORE_LOG_ID: ${{ github.event.inputs.backup_log_id }}
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Restore succeeded
        if: steps.restore.outcome == 'success'
        run: |
          echo "Restore completed. The public schema of '${{ github.event.inputs.environment }}' was replaced from '${{ github.event.inputs.backup_file_path }}'."

      - name: Restore failed
        if: failure() && steps.restore.outcome != 'success'
        run: |
          echo "Restore FAILED. The database may be in a partial state."
          echo "Re-run this workflow with a known-good backup file to recover."
